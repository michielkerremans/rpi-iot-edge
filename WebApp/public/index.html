<!doctype html>

<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <script src="https://code.jquery.com/jquery-3.4.0.min.js"
        integrity="sha256-BJeo0qm959uMBGb65z40ejJYGSgR7REI4+CW1fNKwOg=" crossorigin="anonymous" type="text/javascript"
        charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.8.0/dist/Chart.min.js" type="text/javascript"
        charset="utf-8"></script>
    <script src="js/chart-device-data.js" type="text/javascript" charset="utf-8"></script>
    <link href="css/style.css" rel="stylesheet" />

    <!-- <title>Temperature &amp; Humidity Real-time Data</title> -->
    <title>Temperature Real-time Data</title>
</head>

<body>
    <header class="flexHeader">
        <h1 class="mainTitle">Temperature Real-time Data</h1>
        <div class="controls">
            <span id="deviceCount" class="save-indicator" aria-live="polite"></span>

            <!-- Select must be empty so auto-select picks the first appended device -->
            <select id="listOfDevices" class="select_box"></select>

            <label class="small-label" for="telemetryInterval">Interval (ms)</label>
            <input id="telemetryInterval" class="small-input" type="number" min="0" step="100" value="5000" />

            <label for="desiredTemperature" class="small-label">Setpoint (°C)</label>
            <input id="desiredTemperature" class="small-input" type="number" min="0" max="50" step="1" />

            <span id="saveStatus" class="save-indicator" aria-live="polite"></span>
        </div>
    </header>
    <div>
        <canvas id="iotChart"></canvas>
    </div>
</body>

</html>
